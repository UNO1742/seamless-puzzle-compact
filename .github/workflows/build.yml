name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable application
        shell: pwsh
        run: |
          ./build.ps1
          Compress-Archive -Path dist/seamless-puzzle-compact-win-x64 -DestinationPath dist/seamless-puzzle-compact-win-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seamless-puzzle-compact-win-x64
          path: dist/seamless-puzzle-compact-win-x64.zip
